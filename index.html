<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VR YouTube</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ipd: 63;
    --lens-dist: 0.3;
    --screen-size: 85;
    --eye-gap: 20px;
  }

  body {
    background: #000;
    font-family: 'Cairo', sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    color: #fff;
  }

  /* ===== HOME SCREEN ===== */
  #home {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: radial-gradient(ellipse at center, #0a0a1a 0%, #000 100%);
    gap: 24px;
    padding: 30px;
  }

  #home h1 {
    font-size: 2.2rem;
    font-weight: 900;
    background: linear-gradient(135deg, #ff0000, #ff6b6b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -1px;
  }

  #home p {
    color: #888;
    font-size: 0.9rem;
    text-align: center;
  }

  .search-box {
    display: flex;
    width: 100%;
    max-width: 500px;
    gap: 10px;
  }

  .search-box input {
    flex: 1;
    padding: 16px 20px;
    border-radius: 50px;
    border: 2px solid #333;
    background: #111;
    color: #fff;
    font-size: 1rem;
    font-family: 'Cairo', sans-serif;
    outline: none;
    transition: border-color 0.3s;
  }

  .search-box input:focus { border-color: #ff0000; }

  .search-box button, .btn {
    padding: 16px 28px;
    border-radius: 50px;
    border: none;
    background: linear-gradient(135deg, #ff0000, #cc0000);
    color: #fff;
    font-size: 1rem;
    font-family: 'Cairo', sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 20px rgba(255,0,0,0.3);
  }

  .search-box button:active, .btn:active {
    transform: scale(0.96);
  }

  .btn-secondary {
    background: #1a1a2e;
    border: 2px solid #333;
    box-shadow: none;
  }

  .btn-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  /* ===== VR MODE ===== */
  #vr-mode {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
  }

  .vr-split {
    display: flex;
    width: 100%;
    height: 100%;
    gap: var(--eye-gap);
    align-items: center;
    justify-content: center;
    padding: 10px;
  }

  .eye-container {
    flex: 1;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-radius: 20px;
    position: relative;
  }

  .eye-inner {
    width: var(--screen-size, 85%);
    aspect-ratio: 16/9;
    max-height: 90%;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    filter: var(--lens-filter, none);
  }

  .eye-inner iframe {
    width: 100%;
    height: 100%;
    border: none;
    pointer-events: none;
  }

  /* Lens distortion overlay */
  .lens-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
    z-index: 2;
  }

  /* Center divider */
  .divider {
    width: 3px;
    height: 60%;
    background: #222;
    border-radius: 3px;
    flex-shrink: 0;
  }

  /* VR Controls overlay */
  #vr-controls {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.95));
    padding: 20px;
    display: flex;
    justify-content: center;
    gap: 16px;
    z-index: 100;
    flex-wrap: wrap;
    transform: translateY(100%);
    transition: transform 0.3s;
  }

  #vr-controls.visible {
    transform: translateY(0);
  }

  .vr-btn {
    padding: 10px 20px;
    border-radius: 30px;
    border: 1px solid #444;
    background: rgba(20,20,20,0.9);
    color: #fff;
    font-family: 'Cairo', sans-serif;
    font-size: 0.85rem;
    cursor: pointer;
    backdrop-filter: blur(10px);
  }

  .vr-btn.red { border-color: #ff0000; color: #ff6b6b; }

  /* Tap hint */
  #tap-hint {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.7);
    color: #888;
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 0.8rem;
    z-index: 101;
    animation: fadeOut 3s forwards 2s;
  }

  @keyframes fadeOut { to { opacity: 0; } }

  /* ===== SETTINGS ===== */
  #settings-panel {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0,0,0,0.95);
    z-index: 200;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    gap: 24px;
    overflow-y: auto;
  }

  #settings-panel.open { display: flex; }

  #settings-panel h2 {
    font-size: 1.6rem;
    font-weight: 700;
    color: #ff4444;
  }

  .setting-item {
    width: 100%;
    max-width: 450px;
    background: #111;
    border-radius: 16px;
    padding: 20px;
    border: 1px solid #222;
  }

  .setting-item label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 12px;
    color: #ccc;
    font-size: 0.95rem;
  }

  .setting-item label span {
    color: #ff4444;
    font-weight: 700;
  }

  input[type="range"] {
    width: 100%;
    height: 6px;
    -webkit-appearance: none;
    background: #333;
    border-radius: 3px;
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #ff0000;
    cursor: pointer;
  }

  /* Loading */
  #loading {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    flex-direction: column;
    align-items: center;
    gap: 16px;
    z-index: 300;
    background: rgba(0,0,0,0.9);
    padding: 40px;
    border-radius: 20px;
  }

  #loading.show { display: flex; }

  .spinner {
    width: 50px;
    height: 50px;
    border: 4px solid #222;
    border-top-color: #ff0000;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

</style>
</head>
<body>

<!-- HOME -->
<div id="home">
  <h1>🥽 VR YouTube</h1>
  <p>ابحث عن أي فيديو وشاهده في نظارتك</p>

  <div class="search-box">
    <input type="text" id="search-input" placeholder="ابحث في يوتيوب..." />
    <button onclick="searchYouTube()">بحث</button>
  </div>

  <div id="results" style="width:100%;max-width:500px;display:flex;flex-direction:column;gap:10px;max-height:45vh;overflow-y:auto;"></div>

  <div class="btn-row">
    <button class="btn btn-secondary" onclick="openSettings()">⚙️ إعدادات VR</button>
    <button class="btn btn-secondary" onclick="openDirect()">🔗 رابط مباشر</button>
  </div>
</div>

<!-- VR MODE -->
<div id="vr-mode">
  <div id="tap-hint">اضغط الشاشة لإظهار التحكم</div>

  <div class="vr-split">
    <div class="eye-container">
      <div class="eye-inner" id="left-eye">
        <iframe id="left-iframe" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        <div class="lens-overlay"></div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="eye-container">
      <div class="eye-inner" id="right-eye">
        <iframe id="right-iframe" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        <div class="lens-overlay"></div>
      </div>
    </div>
  </div>

  <div id="vr-controls">
    <button class="vr-btn" onclick="openSettings()">⚙️ إعدادات</button>
    <button class="vr-btn" onclick="goHome()">🏠 الرئيسية</button>
    <button class="vr-btn red" onclick="hideControls()">✕ إغلاق</button>
  </div>
</div>

<!-- SETTINGS -->
<div id="settings-panel">
  <h2>⚙️ إعدادات VR</h2>

  <div class="setting-item">
    <label>المسافة بين العينين (IPD) <span id="ipd-val">63mm</span></label>
    <input type="range" min="55" max="75" value="63" oninput="updateIPD(this.value)">
  </div>

  <div class="setting-item">
    <label>حجم الشاشة <span id="size-val">85%</span></label>
    <input type="range" min="50" max="100" value="85" oninput="updateSize(this.value)">
  </div>

  <div class="setting-item">
    <label>تعتيم الحواف (العدسة) <span id="lens-val">30%</span></label>
    <input type="range" min="0" max="80" value="30" oninput="updateLens(this.value)">
  </div>

  <div class="setting-item">
    <label>المسافة بين العينين (فراغ) <span id="gap-val">20px</span></label>
    <input type="range" min="0" max="60" value="20" oninput="updateGap(this.value)">
  </div>

  <div class="btn-row">
    <button class="btn" onclick="closeSettings()">✅ حفظ وإغلاق</button>
    <button class="btn btn-secondary" onclick="resetSettings()">🔄 إعادة تعيين</button>
  </div>
</div>

<!-- LOADING -->
<div id="loading">
  <div class="spinner"></div>
  <p>جاري التحميل...</p>
</div>

<script>
  // ===== STATE =====
  let currentVideoId = null;
  let controlsVisible = false;
  let settings = {
    ipd: 63,
    size: 85,
    lens: 30,
    gap: 20
  };

  // Load settings from localStorage
  const saved = localStorage.getItem('vr-settings');
  if (saved) {
    settings = JSON.parse(saved);
    applyAllSettings();
  }

  // ===== SEARCH =====
  async function searchYouTube() {
    const query = document.getElementById('search-input').value.trim();
    if (!query) return;

    showLoading();
    const resultsDiv = document.getElementById('results');
    resultsDiv.innerHTML = '';

    try {
      // Use YouTube's oEmbed + noembed to get video info
      // Use Invidious public API for search
      const instances = [
        'https://inv.nadeko.net',
        'https://invidious.nerdvpn.de',
        'https://invidious.privacydev.net'
      ];

      let data = null;
      for (const inst of instances) {
        try {
          const res = await fetch(`${inst}/api/v1/search?q=${encodeURIComponent(query)}&type=video`, {signal: AbortSignal.timeout(5000)});
          if (res.ok) { data = await res.json(); break; }
        } catch(e) {}
      }

      hideLoading();

      if (!data || data.length === 0) {
        resultsDiv.innerHTML = '<p style="color:#888;text-align:center;padding:20px;">لا نتائج — جرب بحثاً آخر</p>';
        return;
      }

      data.slice(0, 8).forEach(v => {
        if (!v.videoId) return;
        const item = document.createElement('div');
        item.style.cssText = 'background:#111;border:1px solid #222;border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:border-color 0.2s;';
        item.innerHTML = `
          <img src="${v.videoThumbnails?.[4]?.url || `https://i.ytimg.com/vi/${v.videoId}/mqdefault.jpg`}" 
               style="width:80px;height:45px;object-fit:cover;border-radius:8px;flex-shrink:0;" 
               onerror="this.src='https://i.ytimg.com/vi/${v.videoId}/mqdefault.jpg'">
          <div style="flex:1;min-width:0;">
            <div style="font-size:0.85rem;font-weight:600;color:#fff;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">${v.title}</div>
            <div style="font-size:0.75rem;color:#666;margin-top:4px;">${v.author || ''}</div>
          </div>
          <div style="color:#ff0000;font-size:1.2rem;flex-shrink:0;">▶</div>
        `;
        item.onmouseenter = () => item.style.borderColor = '#ff0000';
        item.onmouseleave = () => item.style.borderColor = '#222';
        item.onclick = () => launchVR(v.videoId);
        resultsDiv.appendChild(item);
      });

    } catch(e) {
      hideLoading();
      resultsDiv.innerHTML = '<p style="color:#888;text-align:center;padding:20px;">خطأ في البحث — تحقق من الإنترنت</p>';
    }
  }

  // Enter on search
  document.getElementById('search-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') searchYouTube();
  });

  // ===== DIRECT URL =====
  function openDirect() {
    const url = prompt('الصق رابط يوتيوب أو معرف الفيديو:');
    if (!url) return;
    const id = extractVideoId(url);
    if (id) launchVR(id);
    else alert('رابط غير صحيح');
  }

  function extractVideoId(url) {
    const patterns = [
      /(?:v=|\/embed\/|\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/,
      /^([a-zA-Z0-9_-]{11})$/
    ];
    for (const p of patterns) {
      const m = url.match(p);
      if (m) return m[1];
    }
    return null;
  }

  // ===== LAUNCH VR =====
  function launchVR(videoId) {
    currentVideoId = videoId;
    const src = `https://www.youtube.com/embed/${videoId}?autoplay=1&controls=1&rel=0&modestbranding=1`;
    document.getElementById('left-iframe').src = src;
    document.getElementById('right-iframe').src = src;

    document.getElementById('home').style.display = 'none';
    document.getElementById('vr-mode').style.display = 'block';

    // Request fullscreen + landscape
    try {
      screen.orientation.lock('landscape').catch(()=>{});
      document.documentElement.requestFullscreen().catch(()=>{});
    } catch(e) {}

    applyAllSettings();
  }

  // ===== CONTROLS =====
  document.getElementById('vr-mode').addEventListener('click', (e) => {
    if (e.target.closest('#vr-controls')) return;
    toggleControls();
  });

  function toggleControls() {
    controlsVisible = !controlsVisible;
    document.getElementById('vr-controls').classList.toggle('visible', controlsVisible);
  }

  function hideControls() {
    controlsVisible = false;
    document.getElementById('vr-controls').classList.remove('visible');
  }

  function goHome() {
    document.getElementById('left-iframe').src = '';
    document.getElementById('right-iframe').src = '';
    document.getElementById('vr-mode').style.display = 'none';
    document.getElementById('home').style.display = 'flex';
    try { document.exitFullscreen(); } catch(e) {}
  }

  // ===== SETTINGS =====
  function openSettings() {
    hideControls();
    document.getElementById('settings-panel').classList.add('open');
    // Sync sliders
    document.querySelectorAll('#settings-panel input[type=range]')[0].value = settings.ipd;
    document.querySelectorAll('#settings-panel input[type=range]')[1].value = settings.size;
    document.querySelectorAll('#settings-panel input[type=range]')[2].value = settings.lens;
    document.querySelectorAll('#settings-panel input[type=range]')[3].value = settings.gap;
    document.getElementById('ipd-val').textContent = settings.ipd + 'mm';
    document.getElementById('size-val').textContent = settings.size + '%';
    document.getElementById('lens-val').textContent = settings.lens + '%';
    document.getElementById('gap-val').textContent = settings.gap + 'px';
  }

  function closeSettings() {
    document.getElementById('settings-panel').classList.remove('open');
    localStorage.setItem('vr-settings', JSON.stringify(settings));
    applyAllSettings();
  }

  function resetSettings() {
    settings = { ipd: 63, size: 85, lens: 30, gap: 20 };
    openSettings();
  }

  function updateIPD(v) {
    settings.ipd = parseInt(v);
    document.getElementById('ipd-val').textContent = v + 'mm';
    applyAllSettings();
  }

  function updateSize(v) {
    settings.size = parseInt(v);
    document.getElementById('size-val').textContent = v + '%';
    applyAllSettings();
  }

  function updateLens(v) {
    settings.lens = parseInt(v);
    document.getElementById('lens-val').textContent = v + '%';
    applyAllSettings();
  }

  function updateGap(v) {
    settings.gap = parseInt(v);
    document.getElementById('gap-val').textContent = v + 'px';
    applyAllSettings();
  }

  function applyAllSettings() {
    // IPD: adjust eye containers width ratio
    const ipdOffset = (settings.ipd - 63) * 0.5;
    document.querySelectorAll('.eye-inner').forEach(el => {
      el.style.width = settings.size + '%';
    });

    // Lens overlay opacity
    const lensOpacity = settings.lens / 100;
    document.querySelectorAll('.lens-overlay').forEach(el => {
      el.style.background = `radial-gradient(ellipse at center, transparent ${50 - settings.lens * 0.3}%, rgba(0,0,0,${lensOpacity}) 100%)`;
    });

    // Eye gap
    document.querySelector('.vr-split').style.gap = settings.gap + 'px';
  }

  // ===== LOADING =====
  function showLoading() {
    document.getElementById('loading').classList.add('show');
  }
  function hideLoading() {
    document.getElementById('loading').classList.remove('show');
  }

  // ===== GYROSCOPE (head tracking hint) =====
  // Will be used to shift iframe src offset in future
  if (window.DeviceOrientationEvent) {
    window.addEventListener('deviceorientation', (e) => {
      // Basic tilt detection — future: pan video
    });
  }
</script>
</body>
</html>
